<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUS 4040 Quiz Simulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.container{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:800px;width:100%;padding:40px}.header{text-align:center;margin-bottom:30px}.header h1{color:#667eea;font-size:2em;margin-bottom:10px}.progress-bar{width:100%;height:10px;background:#e0e0e0;border-radius:5px;margin-bottom:30px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);transition:width .3s;width:0}.qcont{display:none}.qcont.active{display:block}.week-badge{display:inline-block;background:#667eea;color:#fff;padding:5px 15px;border-radius:20px;font-size:.9em;margin-bottom:20px}.qtext{font-size:1.3em;color:#333;margin-bottom:25px;line-height:1.6}.opts{display:flex;flex-direction:column;gap:12px}.opt{background:#f8f9fa;border:2px solid #e0e0e0;border-radius:10px;padding:15px 20px;cursor:pointer;transition:all .3s}.opt:hover:not(.disabled){border-color:#667eea;background:#f0f4ff}.opt.correct{border-color:#28a745;background:#d4edda}.opt.incorrect{border-color:#dc3545;background:#f8d7da}.opt.disabled{cursor:not-allowed;opacity:.7}.expl{margin-top:20px;padding:20px;background:#e7f3ff;border-left:4px solid #667eea;border-radius:5px;display:none}.expl.show{display:block}.expl h4{color:#667eea;margin-bottom:10px}.btns{display:flex;gap:15px;margin-top:25px;justify-content:center}.btn{padding:12px 30px;font-size:1em;border:none;border-radius:10px;cursor:pointer;font-weight:600}.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.start,.results,.retry{text-align:center}.start{display:block}.results,.retry{display:none}.score{font-size:4em;color:#667eea;margin:30px 0;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:30px 0}.stat{background:#f8f9fa;padding:20px;border-radius:10px}.stat-num{font-size:2em;color:#667eea;font-weight:700}.stat-lab{color:#666;font-size:.9em}.qlist{max-height:300px;overflow-y:auto;margin:20px 0}.qitem{padding:10px;margin:5px 0;border-radius:5px;cursor:pointer;background:#f8d7da}.hidden{display:none!important}.fb{font-size:1.2em;font-weight:700;margin:20px 0;padding:15px;border-radius:10px;text-align:center}.fb.correct{background:#d4edda;color:#155724}.fb.incorrect{background:#f8d7da;color:#721c24}
</style>
</head>
<body>
<div class="container">
<div class="start" id="start"><div class="header"><h1>BUS 4040 Quiz Simulator</h1><p>Test your understanding of Weeks 1-3 material</p></div><p style="margin:20px">20 questions | Multiple choice and True/False | Instant feedback | Retry missed</p><div class="btns"><button class="btn btn-primary" onclick="startQuiz()">Start Quiz</button></div></div>
<div class="qcont" id="qcont"><div class="progress-bar"><div class="progress-fill" id="prog"></div></div><div class="week-badge" id="wkBadge">Week 1</div><div class="qtext" id="qText"></div><div class="opts" id="opts"></div><div class="fb hidden" id="fb"></div><div class="expl" id="expl"><h4>Explanation:</h4><p id="explText"></p></div><div class="btns"><button class="btn btn-primary" id="nextBtn" onclick="nextQ()" disabled>Next</button></div></div>
<div class="results" id="results"><div class="header"><h1>Quiz Complete!</h1></div><div class="score" id="finalScore"></div><div class="stats"><div class="stat"><div class="stat-num" id="corrCnt">0</div><div class="stat-lab">Correct</div></div><div class="stat"><div class="stat-num" id="incorrCnt">0</div><div class="stat-lab">Incorrect</div></div><div class="stat"><div class="stat-num" id="pct">0%</div><div class="stat-lab">Score</div></div></div><div class="btns"><button class="btn btn-primary" onclick="restartQuiz()">Retake All</button><button class="btn btn-primary" id="retryBtn" onclick="retryMissed()" style="display:none">Retry Missed</button></div></div>
<div class="retry" id="retry"><div class="header"><h1>Retry Missed</h1></div><div class="qlist" id="retryList"></div><div class="btns"><button class="btn btn-primary" onclick="startRetry()">Start</button><button class="btn btn-primary" onclick="document.getElementById('retry').style.display='none';document.getElementById('results').style.display='block'">Back</button></div></div>
</div>
<script>
const Q=[
{q:"What is the primary purpose of this course?",o:["To teach programming","To show tools and let you decide what gets built","To prepare as software engineer","To make you AI researcher"],c:1,e:"The course states: I will show you tools and you decide what gets built with the tools. AI does the building.",w:"Week 1"},
{q:"Which tools are mentioned for this course?",o:["Only Python and Jupyter","Claude, Mindrouter, GitHub, VS Code, and .md files","Microsoft Office and Excel","Adobe Creative Suite"],c:1,e:"Week 1 lists: Tools: Claude and U of I Mindrouter, GitHub, VS Code, and a lot of .md files",w:"Week 1"},
{q:"What percentage of your grade is the Final Exam?",o:["5%","10%","15%","20%"],c:1,e:"According to the grading breakdown, the Final Exam is worth 10%.",w:"Week 1"},
{q:"True or False: The instructor will trick you on the final exam.",o:["True","False"],c:1,e:"The instructor states: Nothing on the final is a trick, and every question on it gets discussed in class",w:"Week 1"},
{q:"Why is AI considered a game change for business?",o:["Makes computers faster","Removes the bottleneck of expert human software engineers","Replaces all business leaders","Eliminates the need for data"],c:1,e:"The material explains AI is removing the bottleneck of expert human software engineers.",w:"Week 1"},
{q:"Who created Git and in what year?",o:["Bill Gates in 1985","Steve Jobs in 1995","Linus Torvalds in 2005","Mark Zuckerberg in 2004"],c:2,e:"Week 2 states: In 2005, Linus Torvalds created Git for Linux kernel development",w:"Week 2"},
{q:"What is a key advantage of Git over centralized systems?",o:["Requires a central server","Every developer has a full copy of the entire history","Only works on Windows","Slower but more secure"],c:1,e:"Git is decentralized where Every developer holds a full copy of the entire history.",w:"Week 2"},
{q:"Why is Add README important when creating a GitHub repo?",o:["Makes it private","Creates an initial commit mapping to main branch","Installs VS Code","Enables AI features"],c:1,e:"Creating README creates an initial commit that maps the repo to the main branch.",w:"Week 2"},
{q:"What command creates and switches to a new branch?",o:["git branch new-branch","git checkout -b new-branch","git switch new-branch","git create new-branch"],c:1,e:"The material shows: git checkout -b add-hotel-landing-page",w:"Week 2"},
{q:"True or False: In the Git multiverse analogy, main is the original reality.",o:["True","False"],c:0,e:"The Pictures are Better slide states: main is the original reality",w:"Week 2"},
{q:"What command pushes a branch and sets upstream?",o:["git push","git push origin","git push -u origin branch-name","git upload branch-name"],c:2,e:"The material shows: git push -u origin add-hotel-landing-page",w:"Week 2"},
{q:"Why is version control a safety net for AI code?",o:["Makes AI code faster","Every change is reviewable, traceable, and reversible","Automatically fixes bugs","Prevents AI mistakes"],c:1,e:"Git is the safety net for moving fast with AI-generated code: every change is reviewable, traceable, and reversible.",w:"Week 2"},
{q:"When did the AI we use today surface?",o:["1950s","1990s","2011","2023"],c:2,e:"Week 3 states: The AI we are using today surfaced around 2011",w:"Week 3"},
{q:"How does AI work at its basic level?",o:["Reads databases","Uses math to predict the next word","Searches the internet","Follows pre-programmed rules"],c:1,e:"AI takes text in and produces text out. You give it words, and it uses math to predict the next word.",w:"Week 3"},
{q:"Which company makes Claude?",o:["OpenAI","Google","Anthropic","Meta"],c:2,e:"Week 3 clearly states: Anthropic makes Claude",w:"Week 3"},
{q:"What are the four Claude model tiers from largest to smallest?",o:["Opus, Sonnet, Haiku, Fable","Fable, Opus, Sonnet, Haiku","Haiku, Sonnet, Opus, Fable","Sonnet, Haiku, Fable, Opus"],c:1,e:"The material lists: Four model tiers, largest to smallest: Fable, Opus, Sonnet, Haiku",w:"Week 3"},
{q:"Which Claude model is the cost effective everyday workhorse?",o:["Fable","Opus","Sonnet","Haiku"],c:2,e:"According to the material: Sonnet is the cost effective everyday workhorse",w:"Week 3"},
{q:"What does OpenAI call their current top model?",o:["GPT-5","GPT-6","GPT-6 Astra","GPT-7"],c:2,e:"The material states: GPT-6 Astra is the current top model",w:"Week 3"},
{q:"What is the difference between open weight and closed models?",o:["Open weight are free","Closed run on vendor servers, open weight can be downloaded","Open weight only work in Europe","There is no difference"],c:1,e:"Closed models run on vendor servers you rent access. Open weight models can be downloaded and run on your own hardware.",w:"Week 3"},
{q:"What are tokens in AI?",o:["Currency for AI services","Chunks of text, roughly 3/4 of an English word","Security keys","Version numbers"],c:1,e:"Tokens are chunks of text, roughly 3/4 of an English word on average. AI reads a token, not whole words.",w:"Week 3"}
];
let C=[],I=0,S=0,U=[],R=[];
function shuffle(a){let t=[...a];for(let i=t.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[t[i],t[j]]=[t[j],t[i]]}return t}
function startQuiz(){C=shuffle(Q).slice(0,20);I=0;S=0;U=[];document.getElementById("start").style.display="none";document.getElementById("results").style.display="none";document.getElementById("retry").style.display="none";document.getElementById("qcont").classList.add("active");showQ()}
function showQ(){const q=C[I];document.getElementById("prog").style.width=((I/C.length)*100)+"%";document.getElementById("wkBadge").textContent=q.w;document.getElementById("qText").textContent=(I+1)+". "+q.q;const o=document.getElementById("opts");o.innerHTML="";q.o.forEach((x,i)=>{const d=document.createElement("div");d.className="opt";d.textContent=x;d.onclick=()=>selectAnswer(i);o.appendChild(d)});document.getElementById("fb").classList.add("hidden");document.getElementById("expl").classList.remove("show");document.getElementById("nextBtn").disabled=true}
function selectAnswer(i){const q=C[I],os=document.querySelectorAll(".opt");os.forEach(x=>x.classList.add("disabled"));const cor=i===q.c;os[q.c].classList.add("correct");if(i!==q.c)os[i].classList.add("incorrect");if(cor){S++;document.getElementById("fb").textContent="Correct!";document.getElementById("fb").className="fb correct"}else{document.getElementById("fb").textContent="Incorrect";document.getElementById("fb").className="fb incorrect"}document.getElementById("fb").classList.remove("hidden");document.getElementById("explText").textContent=q.e;document.getElementById("expl").classList.add("show");document.getElementById("nextBtn").disabled=false;U.push({qi:I,sel:i,cor:cor})}
function nextQ(){I++;if(I<C.length)showQ();else showResults()}
function showResults(){document.getElementById("qcont").classList.remove("active");document.getElementById("results").style.display="block";const p=Math.round((S/C.length)*100);document.getElementById("finalScore").textContent=S+"/"+C.length;document.getElementById("corrCnt").textContent=S;document.getElementById("incorrCnt").textContent=C.length-S;document.getElementById("pct").textContent=p+"%";if(S<C.length)document.getElementById("retryBtn").style.display="inline-block";else document.getElementById("retryBtn").style.display="none"}
function retryMissed(){R=U.filter(a=>!a.cor).map(a=>C[a.qi]);if(R.length===0){alert("You got all correct!");return}document.getElementById("results").style.display="none";document.getElementById("retry").style.display="block";const rl=document.getElementById("retryList");rl.innerHTML="";R.forEach((q,i)=>{const it=document.createElement("div");it.className="qitem";it.textContent=q.w+": "+q.q;rl.appendChild(it)})}
function startRetry(){C=shuffle(R);I=0;S=0;U=[];document.getElementById("retry").style.display="none";document.getElementById("qcont").classList.add("active");showQ()}
function restartQuiz(){startQuiz()}
</script>
</body>
</html>
